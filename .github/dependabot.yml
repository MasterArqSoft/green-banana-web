# Actualización automática de dependencias (T-40, plan §7, NFR-04).
# Dependabot abre pull requests semanales; cada una pasa por la revisión del usuario
# y por el job `verificar` de .github/workflows/pages.yml antes de fusionarse. Las alertas de seguridad llegan aparte.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      # Parches y menores juntos en un solo PR; las mayores, una por una.
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  # Lighthouse con su propio lock (T-113, DR-08). Solo herramienta de diagnóstico: no
  # entra en el sitio publicado.
  - package-ecosystem: npm
    directory: /tools/lighthouse
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(lighthouse)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Bogota
    commit-message:
      prefix: "ci"
