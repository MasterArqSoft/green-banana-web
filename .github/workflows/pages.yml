# Demo pública del POC/MVP en GitHub Pages (decisión D-09 de spec/05-alcance-y-roadmap.md).
# No es la pipeline completa de R-10 ni el hosting de producción (R-08).
# En los pull requests a main (p. ej. los de Dependabot) solo corre `verificar`: no publica.
# Las acciones van fijadas por SHA de commit (la etiqueta se puede mover; el SHA no) con la
# versión en el comentario. Dependabot (github-actions, mensual) actualiza SHA y comentario.
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Solo lectura por defecto; los permisos de Pages, únicamente en los jobs que publican.
permissions:
  contents: read

# Las publicaciones van en cola, sin cancelarse. En un pull request, un push nuevo
# cancela la verificación anterior del mismo PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verificar-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lo mismo que `npm run validate`. Si algo falla, la demo no se publica.
  # Dos builds (T-71): con el prefijo de la demo en out-pages/, que pasa una prueba de
  # humo y es exactamente lo que se publica, y sin prefijo en out/ para las demás pruebas.
  # Límites de tiempo (T-111, DR-11), medidos con `gh run list`/`gh run view` sobre las
  # 10 ejecuciones de push hasta 10cd67b (2026-10-25): verificar 74–393 s, deploy 8–47 s,
  # lighthouse 91–133 s, prueba de humo con prefijo 7–14 s. T-108 suma ~3 min (WebKit,
  # Firefox y 320 px). Base: ~2 × el máximo observado, redondeado. Un atasco termina con
  # un fallo identificable en vez de esperar las 6 h por defecto del runner.
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ningún paso hace push: no se deja el token en .git/config, donde los
          # scripts de las dependencias podrían leerlo.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Misma versión que en local: .nvmrc es la única fuente (T-110, DR-10).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Bloqueante desde T-72 (H-08): una vulnerabilidad alta o crítica, en producción o
      # desarrollo, frena la publicación y los pull requests. Va primero porque es lo más
      # rápido. Excepciones: política en spec/05-alcance-y-roadmap.md (D-14). Si falla por
      # una caída del servicio de npm, se vuelve a correr el job.
      - name: Auditoría de dependencias (npm audit)
        run: npm run audit:deps

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint, incluye las capas de src/)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas unitarias (Vitest)
        run: npm test

      # El prefijo de Pages es el nombre del repositorio (/green-banana-web).
      - name: Build de la demo, con prefijo (out-pages/)
        run: npm run build:prefijo
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Build sin prefijo (out/)
        run: npm run build

      - name: Presupuesto de peso (≤ 300 KB)
        run: npm run budget

      # Chromium para todo; WebKit y Firefox para el subconjunto @smoke (T-108, DR-05).
      - name: Navegadores para las pruebas e2e
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Pruebas e2e (Playwright + axe)
        run: npx playwright test
        timeout-minutes: 12

      # Aquí se observó en otros entornos un cierre que no terminaba tras pasar los 32
      # casos (auditoría forense y revisión independiente; no reproducido en local ni en
      # CI). El límite hace que falle identificable; no acredita que la causa esté resuelta.
      - name: Prueba de humo del artefacto que se publica
        run: npm run test:prefijo
        timeout-minutes: 5
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Presupuesto de peso del artefacto que se publica
        run: npm run budget:prefijo

      # Solo fuera de los pull requests: el mismo out-pages/ verificado, sin reconstruir.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out-pages
          # Sin esto se excluyen las carpetas que empiezan con punto, como
          # .well-known/security.txt (T-67).
          include-hidden-files: true

      # Trazas y capturas de las pruebas que fallen, para revisarlas en GitHub.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  # Lighthouse móvil, informativo (CI-01, T-85, decisión del usuario del 2026-10-24): no
  # bloquea, porque los servidores de GitHub varían entre corridas; el presupuesto se
  # verifica en local con `npm run lighthouse`. Job aparte (revisión de la Fase 11): corre
  # en paralelo a `deploy`, que no depende de él, así que no retrasa la publicación, y
  # Lighthouse (con su propio lock en tools/lighthouse/, T-113) no corre en el
  # job que genera y sube el artefacto de Pages. Solo lectura, como todo el workflow.
  # Mide las dos landings, / y /en (T-96). Una tabla por página en el resumen del job y
  # el JSON, como artefacto. Desde T-113 (DR-08, F-16) Lighthouse se instala desde su
  # propio lock (tools/lighthouse/), que se audita aquí; sigue sin entrar en `verificar`
  # ni en el artefacto de Pages.
  lighthouse:
    needs: verificar
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Misma versión que en local: .nvmrc es la única fuente (T-110, DR-10).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build sin prefijo (out/)
        run: npm run build

      - name: Navegador (Chromium de Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lighthouse desde su lock (tools/lighthouse)
        run: npm ci --prefix tools/lighthouse

      - name: Auditoría de dependencias de Lighthouse
        run: npm run audit:tooling

      - name: Lighthouse móvil (informativo, no bloquea)
        run: npm run lighthouse
        env:
          LH_SALIDA: lighthouse-resumen.json

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: lighthouse-resumen.json
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # La cola de Pages puede demorar la publicación más que los 47 s observados.
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
